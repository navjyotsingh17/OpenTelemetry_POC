# CI for product catalog micro-service

name: Product-catalog-ci

on:
    push:
        branches:
            - main

jobs:
    
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup go
              uses: actions/setup-go@v2
              with:
                go-version: 1.22

            - name: build project
              run: |
                    go mod download
                    go build -o product-catalog-service main.go

            - name: unit test
              run: |
                go test ./...

    code-quality:
        runs-on: ubuntu-latest

        steps: 
            - name: checkout code
              uses: actions/checkout@v4

            - name: run golangci-lint
              run: | 
                    go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.56.2 golangci-lint run ./...

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: install docker
          uses: docker/setup-buildx-action@v1

        - name: login to docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}
        
        - name: docker push
          uses: docker/build-push-action@v7
          with:
            context: ./
            file: Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }}

    updatek8s:
        runs-on: ubuntu-latest
         
        needs: docker

        steps:
            - name: checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_TOKEN }}

            - name: update tag in k8s deployment manifest
              run: |
                    sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }}|" kubernetes/deploy.yaml
                                        
            - name: commit and push changes
              run: |
                    git config --global user.email "navjyotpulaha@gmail.com"
                    git config --global user.name "Navjyotsingh Pulaha"
                    git add kubernetes/deploy.yaml
                    git commit -m "[CI]: update product catalog image tag"
                    git push origin HEAD:main -f






