
name: ad_service

on:
  push:
      branches: 
             - main

jobs:
    
    build:
      runs-on: ubuntu-latest
    
      steps:
          - name: checkout code
            uses: actions/checkout@v4

          - name: set up JDK 21
            uses: actions/setup-java@v3
            with:
              distribution: temurin
              java-version: 21
          
          - name: grant execute permission for gradlew
            run: chmod +x ./gradlew

          - name: build with gradle
            run: ./gradlew installDist -PprotoSourceDir=./pb

  
    checkstyle:
      runs-on: ubuntu-latest
      
      permissions:
        contents: read
        pull-requests: write
      
      steps:
        - uses: actions/checkout@v6
        - uses: dbelyaev/action-checkstyle@v3
          with:
            github_token: ${{ secrets.GH_TOKEN }}
            reporter: github-pr-review
            level: warning

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: install docker
          uses: docker/setup-buildx-action@v1

        - name: login to docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}
        
        - name: docker push
          uses: docker/build-push-action@v7
          with:
            context: ./
            file: Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/ad-service:${{ github.run_id }}

    updatek8s:
        runs-on: ubuntu-latest
         
        needs: docker

        steps:
            - name: checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_TOKEN }}

            - name: update tag in k8s deployment manifest
              run: |
                    sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/ad-service:${{ github.run_id }}|" kubernetes/deploy.yaml
                                        
            - name: commit and push changes
              run: |
                    git config --global user.email "navjyotpulaha@gmail.com"
                    git config --global user.name "Navjyotsingh Pulaha"
                    git add kubernetes/deploy.yaml
                    git commit -m "[CI]: update ad service image tag"
                    git push origin HEAD:main -f
