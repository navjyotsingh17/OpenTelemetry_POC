name: python-service CI/CD

on:
    push:
        branches:
            - main
    
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

    code_quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v4
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install flake8

            - name: Run flake8
              run: |
                flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    docker:
        runs-on: ubuntu-latest

        needs: build

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: install docker
          uses: docker/setup-buildx-action@v1

        - name: login to docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}
        
        - name: docker push
          uses: docker/build-push-action@v7
          with:
            context: ./
            file: Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/python-service:${{ github.run_id }}
    
    update_k8s:
        runs-on: ubuntu-latest

        needs: docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GH_TOKEN }}

            - name: update tag in k8s deployment manifest
              run: |
                    sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/python-service:${{ github.run_id }}|" kubernetes/deploy.yaml
                                        
            - name: commit and push changes
              run: |
                    git config --global user.email "navjyotpulaha@gmail.com"
                    git config --global user.name "Navjyotsingh Pulaha"
                    git add kubernetes/deploy.yaml
                    git commit -m "[CI]: update python service image tag"
                    git push origin HEAD:main -f
